set_input_mute:
  name: Set input mute
  description: Mute/unmute an input channel.
  fields:
    channel:
      name: Channel
      description: Input channel number (1-based).
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 32
          mode: box
    muted:
      name: Muted
      description: True to mute, false to unmute.
      required: true
      example: true
      selector:
        boolean: {}

set_input_fader:
  name: Set input fader
  description: Set the input channel fader level percent (0-100) for LR.
  fields:
    channel:
      name: Channel
      description: Input channel number (1-based).
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 32
          mode: box
    level:
      name: Level
      description: Fader level percentage (0-100).
      required: true
      example: 50
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: slider

recall_snapshot:
  name: Recall snapshot
  description: Recall a show snapshot. Leave snapshot recall address at 0 to use the Master Fader protocol (DL16S/DL32S); set a non-zero address only for legacy CHANNEL_VALUES recall on some mixers.
  fields:
    snapshot:
      name: Snapshot
      description: Snapshot number (1-based).
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 64
          mode: box

set_parameter:
  name: Set parameter
  description: >-
    Set any mapped parameter on an input channel by name - gain, phantom, HPF, gate,
    comp, the four EQ bands, the eight aux sends and the four FX sends. The address is
    resolved from the mixer model's address map, so no per-parameter service is needed.
    Field names are listed in SPEC.md.
  fields:
    channel:
      name: Channel
      description: Input channel number (1-based).
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 32
          mode: box
    field:
      name: Field
      description: >-
        Parameter key, e.g. gain, phantom, hpf_freq, eq2_gain, aux3_level, fx1_mute.
      required: true
      example: gain
      selector:
        text: {}
    value:
      name: Value
      description: >-
        Natural units - dB for levels and gains, Hz for frequencies, true/false for
        switches. Values outside a field's known range are rejected.
      required: true
      example: 12
      selector:
        text: {}

get_parameter:
  name: Get parameter
  description: >-
    Read any mapped parameter from the locally cached mixer state (the mixer pushes
    changes, so the cache tracks the desk). Returns the value, its address and whether
    the field's meaning has been verified against hardware.
  fields:
    channel:
      name: Channel
      description: Input channel number (1-based).
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 32
          mode: box
    field:
      name: Field
      description: Parameter key, e.g. gain, mute, eq1_freq, aux1_level.
      required: true
      example: gain
      selector:
        text: {}

raw_set_value:
  name: Raw set value
  description: Advanced. Write a single value to a Mackie 'channel values' address.
  fields:
    address:
      name: Address
      description: Address in the Mackie value space.
      required: true
      example: 1
      selector:
        number:
          min: 0
          max: 100000
          mode: box
    int_value:
      name: Integer value
      description: Optional 32-bit integer value to write.
      required: false
      example: 1
      selector:
        number:
          min: -2147483648
          max: 2147483647
          mode: box
    float_value:
      name: Float value
      description: Optional float (fader addresses use dB, matching DigiMixer / Mackie app).
      required: false
      example: 0.5
      selector:
        number:
          min: -1000
          max: 1000
          step: 0.001
          mode: box


set_mute_group:
  name: Set mute group
  description: >-
    Mute or unmute a mute group master. Note the mixer does not report mute group
    state at connect, so the matching switch reads unknown until the first change.
  fields:
    group:
      name: Mute group
      description: Mute group number (1-6).
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 6
          mode: box
    muted:
      name: Muted
      description: True to mute the group, false to unmute.
      required: true
      example: true
      selector:
        boolean:

save_snapshot:
  name: Save snapshot
  description: >-
    Save the mixer's current state into a snapshot slot under the given name.
    This overwrites whatever is in that slot.
  fields:
    snapshot:
      name: Snapshot
      description: Snapshot slot number (1-based).
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 64
          mode: box
    name:
      name: Name
      description: Name to store for this snapshot (ASCII).
      required: true
      example: Front of house
      selector:
        text:

refresh_snapshot_names:
  name: Refresh snapshot names
  description: >-
    Re-download the show archive from the mixer and reload snapshot names.
    Names update automatically while connected; this is for recovering after the
    show was changed by something that did not announce it.
