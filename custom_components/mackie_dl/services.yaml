set_input_mute:
  name: Set input mute
  description: Mute/unmute an input channel.
  fields:
    channel:
      name: Channel
      description: Input channel number (1-based).
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 32
          mode: box
    muted:
      name: Muted
      description: True to mute, false to unmute.
      required: true
      example: true
      selector:
        boolean: {}

set_input_fader:
  name: Set input fader
  description: Set the input channel fader level percent (0-100) for LR.
  fields:
    channel:
      name: Channel
      description: Input channel number (1-based).
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 32
          mode: box
    level:
      name: Level
      description: Fader level percentage (0-100).
      required: true
      example: 50
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: slider

recall_snapshot:
  name: Recall snapshot
  description: Recall a show snapshot. Leave snapshot recall address at 0 to use the Master Fader protocol (DL16S/DL32S); set a non-zero address only for legacy CHANNEL_VALUES recall on some mixers.
  fields:
    snapshot:
      name: Snapshot
      description: Snapshot number (1-based).
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 64
          mode: box

raw_set_value:
  name: Raw set value
  description: Advanced. Write a single value to a Mackie 'channel values' address.
  fields:
    address:
      name: Address
      description: Address in the Mackie value space.
      required: true
      example: 1
      selector:
        number:
          min: 0
          max: 100000
          mode: box
    int_value:
      name: Integer value
      description: Optional 32-bit integer value to write.
      required: false
      example: 1
      selector:
        number:
          min: -2147483648
          max: 2147483647
          mode: box
    float_value:
      name: Float value
      description: Optional float (fader addresses use dB, matching DigiMixer / Mackie app).
      required: false
      example: 0.5
      selector:
        number:
          min: -1000
          max: 1000
          step: 0.001
          mode: box

